<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Time-Rewind Platformer com Personagens e Skip</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body {
      background: #111;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(17, 17, 17, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
    .overlay h1 { color: #8be9fd; margin-bottom: 10px; font-size: 24px; }
    .overlay h2 { color: #50fa7b; margin-bottom: 15px; }
    .overlay p { color: #f8f8f2; margin-bottom: 10px; max-width: 500px; font-size: 14px; line-height: 1.4; }
    
    .btn-menu {
      background: #bd93f9;
      color: #111;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    .btn-menu:active { transform: scale(0.95); }
    
    .diff-container { display: flex; gap: 10px; margin-top: 15px; }
    .btn-easy { background: #50fa7b; }
    .btn-normal { background: #ffb86c; }
    .btn-hard { background: #ff5555; color: #fff; }

    canvas {
      border: 2px solid #333;
      background: #1a1a24;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      max-width: 98vw;
      max-height: 48vh;
    }
    
    .controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      padding: 10px 15px;
      margin-top: 5px;
    }
    .d-pad, .action-btns { display: flex; gap: 10px; align-items: center; }
    .btn {
      background: #282a36;
      border: 2px solid #6272a4;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      width: 55px;
      height: 55px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
    }
    .btn:active { background: #44475a; transform: scale(0.95); }
    .btn-rewind { background: #ff5555; border-color: #ff79c6; }
    .btn-jump { background: #8be9fd; border-color: #50fa7b; color: #111; }
    .btn-skip { background: #f1fa8c; border-color: #ffb86c; color: #111; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- TUTORIAL -->
  <div id="tutorialOverlay" class="overlay">
    <h1>TIME-REWIND PLATFORMER</h1>
    <p><b>Como Jogar:</b> Chegue até a porta amarela para passar de fase.</p>
    <p>Pressione o botão vermelho (R) para voltar o tempo e criar um <b>Fantasma Temporal</b> que ajudará você a segurar botões!</p>
    
    <h2>Escolha a Dificuldade:</h2>
    <div class="diff-container">
      <button class="btn-menu btn-easy" onclick="startGame('easy')">Fácil</button>
      <button class="btn-menu btn-normal" onclick="startGame('normal')">Normal</button>
      <button class="btn-menu btn-hard" onclick="startGame('hard')">Difícil</button>
    </div>
  </div>

  <!-- VITÓRIA -->
  <div id="winOverlay" class="overlay" style="display: none;">
    <h1>PARABÉNS!</h1>
    <p>Você completou todas as fases!</p>
    <button class="btn-menu" onclick="resetGame()">Jogar Novamente</button>
  </div>

  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <!-- CONTROLES -->
  <div class="controls">
    <div class="d-pad">
      <div class="btn" id="btnLeft">←</div>
      <div class="btn" id="btnRight">→</div>
    </div>
    <div class="action-btns">
      <div class="btn btn-skip" id="btnSkip" onclick="skipLevel()">SKIP ▶</div>
      <div class="btn btn-rewind" id="btnRewind">R</div>
      <div class="btn btn-jump" id="btnJump">↑</div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let currentLevelIndex = 0;
let difficulty = 'normal';
let isGameRunning = false;
let rewindsUsed = 0;

// --- FASES ---
const levels = [
  { platforms: [{ x: 0, y: 360, w: 800, h: 40 }, { x: 200, y: 280, w: 120, h: 20 }], button: { x: 250, y: 270, w: 20, h: 10, pressed: false }, door: { x: 730, y: 280, w: 20, h: 80, open: false }, spawn: { x: 50, y: 300 } },
  { platforms: [{ x: 0, y: 360, w: 250, h: 40 }, { x: 300, y: 300, w: 200, h: 20 }, { x: 580, y: 360, w: 220, h: 40 }], button: { x: 380, y: 290, w: 20, h: 10, pressed: false }, door: { x: 730, y: 280, w: 20, h: 80, open: false }, spawn: { x: 50, y: 300 } },
  { platforms: [{ x: 0, y: 360, w: 800, h: 40 }, { x: 150, y: 250, w: 100, h: 20 }, { x: 400, y: 200, w: 120, h: 20 }], button: { x: 450, y: 190, w: 20, h: 10, pressed: false }, door: { x: 730, y: 280, w: 20, h: 80, open: false }, spawn: { x: 50, y: 300 } },
  { platforms: [{ x: 0, y: 360, w: 800, h: 40 }, { x: 600, y: 260, w: 120, h: 20 }, { x: 300, y: 200, w: 100, h: 20 }], button: { x: 650, y: 250, w: 20, h: 10, pressed: false }, door: { x: 340, y: 120, w: 20, h: 80, open: false }, spawn: { x: 50, y: 300 } },
  { platforms: [{ x: 0, y: 360, w: 200, h: 40 }, { x: 250, y: 280, w: 100, h: 20 }, { x: 400, y: 200, w: 100, h: 20 }, { x: 550, y: 280, w: 250, h: 40 }], button: { x: 290, y: 270, w: 20, h: 10, pressed: false }, door: { x: 730, y: 200, w: 20, h: 80, open: false }, spawn: { x: 50, y: 300 } }
];

let GRAVITY = 0.5;

// --- PERSONAGEM PRINCIPAL ---
const player = {
  x: 50, y: 300, w: 24, h: 32,
  vx: 0, vy: 0, speed: 4, jumpForce: 10,
  grounded: false, facing: 'right', history: []
};

let ghost = null;

function applyDifficulty(diff) {
  difficulty = diff;
  if (diff === 'easy') { player.speed = 5; player.jumpForce = 11; }
  else if (diff === 'normal') { player.speed = 4; player.jumpForce = 10; }
  else if (diff === 'hard') { player.speed = 3.5; player.jumpForce = 9.5; }
}

function startGame(diff) {
  applyDifficulty(diff);
  document.getElementById('tutorialOverlay').style.display = 'none';
  document.getElementById('winOverlay').style.display = 'none';
  currentLevelIndex = 0;
  loadLevel(currentLevelIndex);
  isGameRunning = true;
}

function loadLevel(index) {
  const lvl = levels[index];
  player.x = lvl.spawn.x;
  player.y = lvl.spawn.y;
  player.vx = 0; player.vy = 0;
  player.history = [];
  ghost = null;
  rewindsUsed = 0;
  lvl.button.pressed = false;
  lvl.door.open = false;
}

function skipLevel() {
  if (!isGameRunning) return;
  currentLevelIndex++;
  if (currentLevelIndex < levels.length) {
    loadLevel(currentLevelIndex);
  } else {
    isGameRunning = false;
    document.getElementById('winOverlay').style.display = 'flex';
  }
}

function resetGame() {
  document.getElementById('winOverlay').style.display = 'none';
  document.getElementById('tutorialOverlay').style.display = 'flex';
  isGameRunning = false;
}

// --- CONTROLES DE TECLADO E MOUSE ---
const keys = { left: false, right: false, jump: false, rewind: false };

window.addEventListener('keydown', (e) => handleKey(e, true));
window.addEventListener('keyup', (e) => handleKey(e, false));

function handleKey(e, isPressed) {
  if (['KeyA', 'ArrowLeft'].includes(e.code)) keys.left = isPressed;
  if (['KeyD', 'ArrowRight'].includes(e.code)) keys.right = isPressed;
  if (['KeyW', 'ArrowUp', 'Space'].includes(e.code)) keys.jump = isPressed;
  if (e.code === 'KeyR') {
    if (isPressed && !keys.rewind && isGameRunning) triggerRewind();
    keys.rewind = isPressed;
  }
}

function bindTouch(id, keyName, isRewind = false) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (isRewind && isGameRunning) triggerRewind();
    keys[keyName] = true;
  });
  el.addEventListener('touchend', (e) => {
    e.preventDefault();
    keys[keyName] = false;
  });
}

bindTouch('btnLeft', 'left');
bindTouch('btnRight', 'right');
bindTouch('btnJump', 'jump');
bindTouch('btnRewind', 'rewind', true);

function triggerRewind() {
  if (player.history.length === 0) return;
  rewindsUsed++;
  ghost = { actions: [...player.history], frameIndex: 0 };
  const lvl = levels[currentLevelIndex];
  player.x = lvl.spawn.x;
  player.y = lvl.spawn.y;
  player.vx = 0; player.vy = 0;
  player.history = [];
}

// --- LÓGICA DO JOGO ---
function update() {
  if (!isGameRunning) return;

  const lvl = levels[currentLevelIndex];

  if (keys.left) { player.vx = -player.speed; player.facing = 'left'; }
  else if (keys.right) { player.vx = player.speed; player.facing = 'right'; }
  else player.vx = 0;

  if (keys.jump && player.grounded) {
    player.vy = -player.jumpForce;
    player.grounded = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

  if (player.y > canvas.height) loadLevel(currentLevelIndex);

  player.grounded = false;
  lvl.platforms.forEach(p => {
    if (
      player.x < p.x + p.w && player.x + player.w > p.x &&
      player.y + player.h >= p.y && player.y + player.h <= p.y + player.vy + 1 &&
      player.vy >= 0
    ) {
      player.grounded = true;
      player.vy = 0;
      player.y = p.y - player.h;
    }
  });

  player.history.push({ x: player.x, y: player.y, facing: player.facing });

  let ghostPos = null;
  if (ghost) {
    if (ghost.frameIndex < ghost.actions.length) {
      ghostPos = ghost.actions[ghost.frameIndex];
      ghost.frameIndex++;
    } else {
      ghostPos = ghost.actions[ghost.actions.length - 1];
    }
  }

  const pOnBtn = checkOverlap(player, lvl.button);
  const gOnBtn = ghostPos ? checkOverlap({ ...ghostPos, w: player.w, h: player.h }, lvl.button) : false;

  lvl.button.pressed = pOnBtn || gOnBtn;
  lvl.door.open = lvl.button.pressed;

  if (lvl.door.open && checkOverlap(player, lvl.door)) {
    const stars = rewindsUsed <= 1 ? 3 : (rewindsUsed <= 3 ? 2 : 1);
    alert(`Fase ${currentLevelIndex + 1} Concluída!\nEstrelas: ${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}`);
    skipLevel();
  }
}

function checkOverlap(r1, r2) {
  return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
         r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

// --- DESENHO DE PERSONAGEM (SPRITE DESENHADO VIA CANVAS) ---
function drawCharacter(x, y, w, h, facing, bodyColor, eyeColor) {
  // Corpo / Cabeça
  ctx.fillStyle = bodyColor;
  ctx.fillRect(x, y, w, h);

  // Olhos para indicar direção
  ctx.fillStyle = eyeColor;
  const eyeSize = 4;
  const eyeY = y + 8;
  
  if (facing === 'right') {
    ctx.fillRect(x + w - 8, eyeY, eyeSize, eyeSize);
    ctx.fillRect(x + w - 16, eyeY, eyeSize, eyeSize);
  } else {
    ctx.fillRect(x + 4, eyeY, eyeSize, eyeSize);
    ctx.fillRect(x + 12, eyeY, eyeSize, eyeSize);
  }
}

// --- DESENHO GERAL ---
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const lvl = levels[currentLevelIndex];

  // Plataformas
  ctx.fillStyle = '#44475a';
  lvl.platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

  // Botão
  ctx.fillStyle = lvl.button.pressed ? '#50fa7b' : '#ff5555';
  ctx.fillRect(lvl.button.x, lvl.button.pressed ? lvl.button.y + 6 : lvl.button.y, lvl.button.w, lvl.button.pressed ? 4 : lvl.button.h);

  // Porta
  if (!lvl.door.open) {
    ctx.fillStyle = '#ffb86c';
    ctx.fillRect(doorX = lvl.door.x, doorY = lvl.door.y, lvl.door.w, lvl.door.h);
  } else {
    ctx.strokeStyle = '#ffb86c';
    ctx.strokeRect(lvl.door.x, lvl.door.y, lvl.door.w, lvl.door.h);
  }

  // Desenha o Fantasma
  if (ghost) {
    const frame = Math.min(ghost.frameIndex, ghost.actions.length - 1);
    const pos = ghost.actions[frame];
    drawCharacter(pos.x, pos.y, player.w, player.h, pos.facing || 'right', 'rgba(80, 250, 123, 0.6)', '#111');
  }

  // Desenha o Jogador Principal
  drawCharacter(player.x, player.y, player.w, player.h, player.facing, '#8be9fd', '#282a36');

  // HUD
  if (isGameRunning) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`FASE ${currentLevelIndex + 1} / ${levels.length}`, 10, 25);
    
    // Estrelas atuais
    const currentStars = rewindsUsed <= 1 ? 3 : (rewindsUsed <= 3 ? 2 : 1);
    ctx.fillStyle = '#f1fa8c';
    ctx.fillText(`Estrelas: ${'★'.repeat(currentStars)}${'☆'.repeat(3 - currentStars)}`, 10, 45);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
