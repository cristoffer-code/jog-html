<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Time-Rewind Platformer - Hard Mode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body {
      background: #111;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(17, 17, 17, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
    .overlay h1 { color: #8be9fd; margin-bottom: 10px; font-size: 24px; }
    .overlay h2 { color: #50fa7b; margin-bottom: 15px; }
    .overlay p { color: #f8f8f2; margin-bottom: 10px; max-width: 500px; font-size: 14px; line-height: 1.4; }
    
    .btn-menu {
      background: #bd93f9;
      color: #111;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    .btn-menu:active { transform: scale(0.95); }
    
    .diff-container { display: flex; gap: 10px; margin-top: 15px; }
    .btn-easy { background: #50fa7b; }
    .btn-normal { background: #ffb86c; }
    .btn-hard { background: #ff5555; color: #fff; }

    canvas {
      border: 2px solid #333;
      background: #1a1a24;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      max-width: 98vw;
      max-height: 48vh;
    }
    
    .controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      padding: 10px 15px;
      margin-top: 5px;
    }
    .d-pad, .action-btns { display: flex; gap: 10px; align-items: center; }
    .btn {
      background: #282a36;
      border: 2px solid #6272a4;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      width: 55px;
      height: 55px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
    }
    .btn:active { background: #44475a; transform: scale(0.95); }
    .btn-rewind { background: #ff5555; border-color: #ff79c6; }
    .btn-jump { background: #8be9fd; border-color: #50fa7b; color: #111; }
    .btn-skip { background: #f1fa8c; border-color: #ffb86c; color: #111; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- TUTORIAL -->
  <div id="tutorialOverlay" class="overlay">
    <h1>TIME-REWIND PLATFORMER</h1>
    <p><b>Aviso:</b> Plataformas agora são completamente sólidas!</p>
    <p><b>Botões:</b><br>
    🔴 Vermelho: Requer pressão contínua.<br>
    🟡 Amarelo/Verde: Botão temporizado (fica ativo por alguns segundos).</p>
    
    <h2>Escolha a Dificuldade:</h2>
    <div class="diff-container">
      <button class="btn-menu btn-easy" onclick="startGame('easy')">Fácil</button>
      <button class="btn-menu btn-normal" onclick="startGame('normal')">Normal</button>
      <button class="btn-menu btn-hard" onclick="startGame('hard')">Difícil</button>
    </div>
  </div>

  <!-- VITÓRIA -->
  <div id="winOverlay" class="overlay" style="display: none;">
    <h1>PARABÉNS!</h1>
    <p>Você superou todos os desafios temporais!</p>
    <button class="btn-menu" onclick="resetGame()">Jogar Novamente</button>
  </div>

  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <!-- CONTROLES -->
  <div class="controls">
    <div class="d-pad">
      <div class="btn" id="btnLeft">←</div>
      <div class="btn" id="btnRight">→</div>
    </div>
    <div class="action-btns">
      <div class="btn btn-skip" id="btnSkip" onclick="skipLevel()">SKIP ▶</div>
      <div class="btn btn-rewind" id="btnRewind">R</div>
      <div class="btn btn-jump" id="btnJump">↑</div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let currentLevelIndex = 0;
let difficulty = 'normal';
let isGameRunning = false;
let rewindsUsed = 0;

// --- CONFIGURAÇÃO DAS FASES ---
// Tipo de botões:
// 'hold': Vermelho (deve ficar pisado)
// 'timer': Amarelo (permanece ativo por N frames quando pisado)
const levels = [
  // Fase 1: Introdução aos múltiplos botões (1 contínuo + 1 temporizado)
  {
    platforms: [
      { x: 0, y: 360, w: 800, h: 40 },
      { x: 200, y: 260, w: 120, h: 20 },
      { x: 500, y: 260, w: 120, h: 20 }
    ],
    buttons: [
      { x: 250, y: 250, w: 20, h: 10, type: 'hold', pressed: false },
      { x: 550, y: 250, w: 20, h: 10, type: 'timer', timerDuration: 180, timer: 0, pressed: false }
    ],
    door: { x: 730, y: 280, w: 20, h: 80, open: false },
    spawn: { x: 50, y: 300 }
  },
  // Fase 2: Plataforma dividindo o mapa com 2 botões temporizados
  {
    platforms: [
      { x: 0, y: 360, w: 800, h: 40 },
      { x: 350, y: 150, w: 40, h: 210 }, // Parede vertical
      { x: 100, y: 260, w: 120, h: 20 },
      { x: 500, y: 260, w: 120, h: 20 }
    ],
    buttons: [
      { x: 140, y: 250, w: 20, h: 10, type: 'timer', timerDuration: 240, timer: 0, pressed: false },
      { x: 550, y: 250, w: 20, h: 10, type: 'hold', pressed: false }
    ],
    door: { x: 730, y: 280, w: 20, h: 80, open: false },
    spawn: { x: 50, y: 300 }
  },
  // Fase 3: Desafio com 3 botões em níveis diferentes
  {
    platforms: [
      { x: 0, y: 360, w: 800, h: 40 },
      { x: 150, y: 270, w: 100, h: 20 },
      { x: 350, y: 200, w: 100, h: 20 },
      { x: 550, y: 130, w: 100, h: 20 }
    ],
    buttons: [
      { x: 190, y: 260, w: 20, h: 10, type: 'timer', timerDuration: 200, timer: 0, pressed: false },
      { x: 390, y: 190, w: 20, h: 10, type: 'hold', pressed: false },
      { x: 590, y: 120, w: 20, h: 10, type: 'timer', timerDuration: 180, timer: 0, pressed: false }
    ],
    door: { x: 730, y: 280, w: 20, h: 80, open: false },
    spawn: { x: 50, y: 300 }
  }
];

let GRAVITY = 0.5;

// --- PERSONAGEM PRINCIPAL ---
const player = {
  x: 50, y: 300, w: 24, h: 32,
  vx: 0, vy: 0, speed: 4, jumpForce: 10,
  grounded: false, facing: 'right', history: []
};

let ghost = null;

function applyDifficulty(diff) {
  difficulty = diff;
  if (diff === 'easy') { player.speed = 4.5; player.jumpForce = 11; }
  else if (diff === 'normal') { player.speed = 4; player.jumpForce = 10; }
  else if (diff === 'hard') { player.speed = 3.5; player.jumpForce = 9.5; }
}

function startGame(diff) {
  applyDifficulty(diff);
  document.getElementById('tutorialOverlay').style.display = 'none';
  document.getElementById('winOverlay').style.display = 'none';
  currentLevelIndex = 0;
  loadLevel(currentLevelIndex);
  isGameRunning = true;
}

function loadLevel(index) {
  const lvl = levels[index];
  player.x = lvl.spawn.x;
  player.y = lvl.spawn.y;
  player.vx = 0; player.vy = 0;
  player.history = [];
  ghost = null;
  rewindsUsed = 0;

  lvl.buttons.forEach(b => {
    b.pressed = false;
    if (b.type === 'timer') b.timer = 0;
  });
  lvl.door.open = false;
}

function skipLevel() {
  if (!isGameRunning) return;
  currentLevelIndex++;
  if (currentLevelIndex < levels.length) {
    loadLevel(currentLevelIndex);
  } else {
    isGameRunning = false;
    document.getElementById('winOverlay').style.display = 'flex';
  }
}

function resetGame() {
  document.getElementById('winOverlay').style.display = 'none';
  document.getElementById('tutorialOverlay').style.display = 'flex';
  isGameRunning = false;
}

// --- CONTROLES DE TECLADO E TOQUE ---
const keys = { left: false, right: false, jump: false, rewind: false };

window.addEventListener('keydown', (e) => handleKey(e, true));
window.addEventListener('keyup', (e) => handleKey(e, false));

function handleKey(e, isPressed) {
  if (['KeyA', 'ArrowLeft'].includes(e.code)) keys.left = isPressed;
  if (['KeyD', 'ArrowRight'].includes(e.code)) keys.right = isPressed;
  if (['KeyW', 'ArrowUp', 'Space'].includes(e.code)) keys.jump = isPressed;
  if (e.code === 'KeyR') {
    if (isPressed && !keys.rewind && isGameRunning) triggerRewind();
    keys.rewind = isPressed;
  }
}

function bindTouch(id, keyName, isRewind = false) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (isRewind && isGameRunning) triggerRewind();
    keys[keyName] = true;
  });
  el.addEventListener('touchend', (e) => {
    e.preventDefault();
    keys[keyName] = false;
  });
}

bindTouch('btnLeft', 'left');
bindTouch('btnRight', 'right');
bindTouch('btnJump', 'jump');
bindTouch('btnRewind', 'rewind', true);

function triggerRewind() {
  if (player.history.length === 0) return;
  rewindsUsed++;
  ghost = { actions: [...player.history], frameIndex: 0 };
  const lvl = levels[currentLevelIndex];
  player.x = lvl.spawn.x;
  player.y = lvl.spawn.y;
  player.vx = 0; player.vy = 0;
  player.history = [];
}

// --- LÓGICA DE COLISÃO SÓLIDA ---
function moveAndCollide(obj, platforms) {
  // Movimento Horizontal
  obj.x += obj.vx;
  platforms.forEach(p => {
    if (checkOverlap(obj, p)) {
      if (obj.vx > 0) obj.x = p.x - obj.w;
      else if (obj.vx < 0) obj.x = p.x + p.w;
    }
  });

  // Movimento Vertical
  obj.y += obj.vy;
  obj.grounded = false;
  platforms.forEach(p => {
    if (checkOverlap(obj, p)) {
      if (obj.vy > 0) { // Caindo
        obj.y = p.y - obj.h;
        obj.vy = 0;
        obj.grounded = true;
      } else if (obj.vy < 0) { // Subindo / Bateu a cabeça
        obj.y = p.y + p.h;
        obj.vy = 0;
      }
    }
  });
}

// --- LÓGICA DO JOGO ---
function update() {
  if (!isGameRunning) return;

  const lvl = levels[currentLevelIndex];

  // Controles
  if (keys.left) { player.vx = -player.speed; player.facing = 'left'; }
  else if (keys.right) { player.vx = player.speed; player.facing = 'right'; }
  else player.vx = 0;

  if (keys.jump && player.grounded) {
    player.vy = -player.jumpForce;
    player.grounded = false;
  }

  player.vy += GRAVITY;

  // Aplica colisão nas 4 direções
  moveAndCollide(player, lvl.platforms);

  // Limites da Tela
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
  if (player.y > canvas.height) loadLevel(currentLevelIndex);

  // Grava o histórico para o Fantasma
  player.history.push({ x: player.x, y: player.y, facing: player.facing });

  // Posição do Fantasma
  let ghostPos = null;
  if (ghost) {
    if (ghost.frameIndex < ghost.actions.length) {
      ghostPos = ghost.actions[ghost.frameIndex];
      ghost.frameIndex++;
    } else {
      ghostPos = ghost.actions[ghost.actions.length - 1];
    }
  }

  // --- ATUALIZAÇÃO DOS BOTÕES ---
  let allButtonsActive = true;

  lvl.buttons.forEach(btn => {
    const pOnBtn = checkOverlap(player, btn);
    const gOnBtn = ghostPos ? checkOverlap({ ...ghostPos, w: player.w, h: player.h }, btn) : false;
    const isSteppedOn = pOnBtn || gOnBtn;

    if (btn.type === 'hold') {
      btn.pressed = isSteppedOn;
    } else if (btn.type === 'timer') {
      if (isSteppedOn) {
        btn.timer = btn.timerDuration; // Recarrega o temporizador
      } else if (btn.timer > 0) {
        btn.timer--;
      }
      btn.pressed = btn.timer > 0;
    }

    if (!btn.pressed) allButtonsActive = false;
  });

  lvl.door.open = allButtonsActive;

  // Vitória da Fase
  if (lvl.door.open && checkOverlap(player, lvl.door)) {
    const stars = rewindsUsed <= 1 ? 3 : (rewindsUsed <= 3 ? 2 : 1);
    alert(`Fase ${currentLevelIndex + 1} Concluída!\nEstrelas: ${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}`);
    skipLevel();
  }
}

function checkOverlap(r1, r2) {
  return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
         r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

// --- DESENHO DO PERSONAGEM ---
function drawCharacter(x, y, w, h, facing, bodyColor, eyeColor) {
  ctx.fillStyle = bodyColor;
  ctx.fillRect(x, y, w, h);

  ctx.fillStyle = eyeColor;
  const eyeSize = 4;
  const eyeY = y + 8;
  
  if (facing === 'right') {
    ctx.fillRect(x + w - 8, eyeY, eyeSize, eyeSize);
    ctx.fillRect(x + w - 16, eyeY, eyeSize, eyeSize);
  } else {
    ctx.fillRect(x + 4, eyeY, eyeSize, eyeSize);
    ctx.fillRect(x + 12, eyeY, eyeSize, eyeSize);
  }
}

// --- DESENHO DO JOGO ---
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const lvl = levels[currentLevelIndex];

  // Desenha Plataformas
  ctx.fillStyle = '#44475a';
  lvl.platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

  // Desenha Botões
  lvl.buttons.forEach(btn => {
    if (btn.type === 'hold') {
      ctx.fillStyle = btn.pressed ? '#50fa7b' : '#ff5555'; // Vermelho / Verde
    } else {
      ctx.fillStyle = btn.pressed ? '#f1fa8c' : '#ffb86c'; // Amarelo ativo / Laranja inativo
    }
    
    const height = btn.pressed ? 4 : btn.h;
    const yPos = btn.pressed ? btn.y + 6 : btn.y;
    ctx.fillRect(btn.x, yPos, btn.w, height);

    // Se for temporizado e estiver ativo, exibe barra de tempo restante
    if (btn.type === 'timer' && btn.timer > 0) {
      const pct = btn.timer / btn.timerDuration;
      ctx.fillStyle = '#f1fa8c';
      ctx.fillRect(btn.x, btn.y - 6, btn.w * pct, 3);
    }
  });

  // Desenha Porta
  if (!lvl.door.open) {
    ctx.fillStyle = '#ffb86c';
    ctx.fillRect(lvl.door.x, lvl.door.y, lvl.door.w, lvl.door.h);
  } else {
    ctx.strokeStyle = '#ffb86c';
    ctx.strokeRect(lvl.door.x, lvl.door.y, lvl.door.w, lvl.door.h);
  }

  // Desenha o Fantasma
  if (ghost) {
    const frame = Math.min(ghost.frameIndex, ghost.actions.length - 1);
    const pos = ghost.actions[frame];
    drawCharacter(pos.x, pos.y, player.w, player.h, pos.facing || 'right', 'rgba(80, 250, 123, 0.6)', '#111');
  }

  // Desenha o Jogador Principal
  drawCharacter(player.x, player.y, player.w, player.h, player.facing, '#8be9fd', '#282a36');

  // HUD
  if (isGameRunning) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`FASE ${currentLevelIndex + 1} / ${levels.length}`, 10, 25);
    
    const currentStars = rewindsUsed <= 1 ? 3 : (rewindsUsed <= 3 ? 2 : 1);
    ctx.fillStyle = '#f1fa8c';
    ctx.fillText(`Estrelas: ${'★'.repeat(currentStars)}${'☆'.repeat(3 - currentStars)}`, 10, 45);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
